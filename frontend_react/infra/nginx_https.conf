map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=expensive_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=websocket_clients:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name  localhost;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root   /usr/share/nginx/html;
    index index.html;
    error_page   500 502 503 504  /50x.html;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    include /etc/nginx/common_routes.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

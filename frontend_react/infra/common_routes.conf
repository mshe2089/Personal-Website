location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

location /assets {
    expires 1y;
    add_header Cache-Control "public";
}

location /api/v1/python {
    limit_req zone=general_api burst=20 nodelay;
    rewrite ^/api/v1/python/?(.*)$ /api/v1/$1 break;
    proxy_pass http://core:5000;
}

location /api/v1/rust {
    limit_req zone=expensive_api burst=4 nodelay;
    proxy_pass http://rust:8000;
}

location ~ ^/api/v1/rust/.*ws$ {
    limit_req zone=expensive_api burst=3 nodelay;
    limit_conn websocket_clients 3;
    proxy_pass http://rust:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

services:
  core:
    build:
      context: .
      dockerfile: ./server_fastapi/dockerfile.flaskr
    image: personal-website-api
    restart: always
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
  api:
    build:
      context: .
      dockerfile: ./frontend_react/infra/dockerfile.reactf
    image: personal-website-client
    restart: always
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ${SSL_CERT_PATH:-./certs}:/etc/nginx/ssl
    depends_on:
      - core
      - rust
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always

  # Rust canvas service - handles HTTP/WebSocket canvas endpoints
  rust:
    build:
      context: ./server_rust
      dockerfile: Dockerfile
    image: personal-website-rust-server
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - CANVAS_TTL_SECONDS=${CANVAS_TTL_SECONDS:-86400}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:

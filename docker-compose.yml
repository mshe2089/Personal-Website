services:
  core:
    build:
      context: .
      dockerfile: ./server_fastapi/dockerfile.flaskr
    image: personal-website-api
    user: "1000:1000"
    restart: always
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - PALWORLD_API_URL=http://host.docker.internal:8212/v1/api
      - PALWORLD_ADMIN_PASSWORD_FILE=/run/secrets/palworld_admin_password
      - PALWORLD_PUBLIC_HOSTNAME=pal.muqing.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - palworld_admin_password
    volumes:
      - /proc:/host/proc:ro
  api:
    build:
      context: .
      dockerfile: ./frontend_react/infra/dockerfile.reactf
    image: personal-website-client
    restart: always
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ${SSL_CERT_PATH:-./certs}:/etc/nginx/ssl
    depends_on:
      - core
      - rust
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    restart: always
    environment:
      - CLOUDFLARE_API_TOKEN_FILE=/run/secrets/cloudflare_ddns_token
      - IP4_DOMAINS=pal.muqing.dev
      - PROXIED=false
    secrets:
      - cloudflare_ddns_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Rust canvas service - handles HTTP/WebSocket canvas endpoints
  rust:
    build:
      context: ./server_rust
      dockerfile: Dockerfile
    image: personal-website-rust-server
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - CANVAS_TTL_SECONDS=${CANVAS_TTL_SECONDS:-86400}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:

secrets:
  cloudflare_ddns_token:
    file: ./.secrets/cloudflare-ddns-token
  palworld_admin_password:
    file: ./.secrets/palworld-admin-password
